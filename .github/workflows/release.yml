name: release

# Push a tag to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Install the release that was just published, the way users will.
  verify:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" \
            | STACKPILOT_VERSION="${{ github.ref_name }}" sh
          "$HOME/.local/bin/stackpilot" version | grep -F "${GITHUB_REF_NAME#v}"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:STACKPILOT_VERSION = '${{ github.ref_name }}'
          irm 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.ps1' | iex
          $out = & "$env:LOCALAPPDATA\Programs\stackpilot\stackpilot.exe" version
          if ($out -notmatch [regex]::Escape('${{ github.ref_name }}'.TrimStart('v'))) { throw "unexpected version: $out" }
